<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BengKu Mitra: prototype klik</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1A4A94;--y:#FFC93C;--n:#10264A;--bg:#F3F5F8;--ok:#1E8E5A;--er:#C0392B;--ln:#DDE3EA;--mu:#5B6B7B;--page:#E6EBF1;--side:#fff;--ink:#10264A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0B1626;--side:#14233A;--ink:#E8EEF7}}
:root[data-theme="dark"]{--page:#0B1626;--side:#14233A;--ink:#E8EEF7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif;display:flex;min-height:100vh;gap:24px;padding:20px;justify-content:center;align-items:flex-start}
aside{width:230px;position:sticky;top:20px;background:var(--side);border-radius:16px;padding:16px}
aside h1{font-size:18px;margin:0 0 4px}aside p{font-size:12px;color:var(--mu);margin:0 0 10px;line-height:1.5}
aside b{display:block;font-size:12px;margin:12px 0 4px}
.sb{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font:600 13px inherit;color:var(--ink);cursor:pointer;min-height:36px}
.sb:hover,.sb:focus-visible{background:var(--b);color:#fff;outline:0}
.phone{width:410px;height:864px;background:var(--n);border-radius:44px;padding:10px;flex:none;box-shadow:0 12px 40px rgba(16,38,74,.35)}
#app{width:390px;height:844px;border-radius:34px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;color:#10264A}
.hd{background:var(--b);color:#fff;padding:44px 18px 16px;display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:17px}.hd small{opacity:.8;font-size:12px;display:block;margin-top:2px}
.bd{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;background:#fff;border-top:1px solid var(--ln)}
.nav button{flex:1;border:0;background:none;padding:8px 0 10px;font:600 11px inherit;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.nav button span{font-size:19px}.nav .on{color:var(--b)}
.c{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.f{flex:1}
.mu{color:var(--mu);font-size:12px}.big{font-size:22px;font-weight:800}.h2{font-weight:700;font-size:15px}
.btn{border:0;border-radius:12px;min-height:48px;padding:0 16px;font:700 14px inherit;background:var(--b);color:var(--y);cursor:pointer;width:100%}
.btn.y{background:var(--y);color:var(--n)}.btn.g{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.red{background:#fff;color:var(--er);border:1px solid var(--er)}
.btn.sm{width:auto;min-height:36px;padding:0 12px;font-size:12px}
.on-card{border-radius:16px;padding:16px;color:#fff;display:flex;justify-content:space-between;align-items:center;background:var(--mu)}
.on-card.live{background:var(--ok)}
.sw{width:56px;height:32px;border-radius:99px;background:#fff5;border:0;position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{left:27px}.sw.on{background:#fff6}
.sw.dk{background:#C5CDD6}.sw.dk.on{background:var(--ok)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:16px}.st span{font-size:11px;color:var(--mu)}
.seg{display:flex;background:#E3E8EE;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:36px;font:700 13px inherit;color:var(--mu);cursor:pointer}
.seg .on{background:#fff;color:var(--b)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E3ECFA;color:var(--b)}
.pill.ok{background:#DDF3E8;color:var(--ok)}.pill.w{background:#FFF1CC;color:#8A6100}
.warn{background:#FFF1CC;border-radius:12px;padding:10px 12px;font-size:12px;color:#6B4B00;line-height:1.5}
.stp{display:flex;gap:4px}.stp i{flex:1;height:5px;border-radius:9px;background:#CFD7E0}.stp i.d{background:var(--b)}
.map{height:170px;border-radius:14px;position:relative;overflow:hidden;background:#DCE8DF;background-image:linear-gradient(90deg,#fff9 2px,transparent 2px),linear-gradient(#fff9 2px,transparent 2px);background-size:46px 46px}
.map:before{content:"";position:absolute;left:18%;top:70%;width:60%;height:4px;background:var(--b);transform-origin:left;transform:rotate(-24deg);border-radius:4px}
.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:14px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.row.t{font-weight:800;font-size:15px;border-top:1px dashed var(--ln);padding-top:9px;margin-top:3px}
.ov{position:absolute;inset:0;background:#10264Acc;display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px 24px;width:100%;display:flex;flex-direction:column;gap:10px}
.ring{position:relative;width:64px;height:64px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:10px;color:var(--mu)}
.bars i{width:100%;background:var(--b);border-radius:6px 6px 2px 2px;display:block}.bars .h i{background:var(--y)}
.stp2{display:flex;align-items:center;gap:6px}.stp2 button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:#fff;font:700 16px inherit;cursor:pointer;color:var(--b)}
.toast{position:absolute;left:16px;right:16px;top:100px;background:var(--n);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;z-index:9}
.chk{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0;cursor:pointer}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid #9AA7B5;display:grid;place-items:center;font-style:normal;color:#fff;font-size:13px}.chk.d i{background:var(--ok);border-color:var(--ok)}
input[type=range]{width:100%;accent-color:var(--b)}
.ah{background:var(--b);color:#fff;padding:44px 18px 14px;font-weight:700;font-size:17px}
.bd h2.lb{font-size:15px;color:var(--b);margin:0}
.bd p.sm{font-size:13px;color:#4B5B6B;margin:0;line-height:1.5}
.ot{width:48px;min-height:48px;border:1px solid #9AA7B5;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.spl{background:#FDF8FB;display:flex;flex-direction:column;align-items:center;padding:56px 24px 24px;gap:14px;flex:1}
.in{border:1px solid #9AA7B5;border-radius:10px;min-height:46px;padding:0 12px;font:14px inherit;width:100%;color:#10264A;background:#fff}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media(max-width:700px){body{flex-direction:column;align-items:center;padding:12px}aside{position:static;width:100%}.phone{zoom:.9}}
</style></head><body>
<aside>
<h1>BengKu Mitra</h1>
<p>Prototype klik sisi mitra mekanik. Alurnya seperti driver ShopeeFood/GrabFood, tampilannya seperti aplikasi merchant.</p>
<b>Lompat ke layar</b>
<button class="sb" data-a="go" data-v="splash">Splash</button>
<button class="sb" data-a="go" data-v="daftar">Daftar mitra</button>
<button class="sb" data-a="go" data-v="otp">OTP email</button>
<button class="sb" data-a="go" data-v="login">Login email</button>
<button class="sb" data-a="go" data-v="home">Beranda dan status online</button>
<button class="sb" data-a="sim">Order masuk (60 detik)</button>
<button class="sb" data-a="demo" data-v="0">Alur kerja: menuju lokasi</button>
<button class="sb" data-a="demo" data-v="2">Alur kerja: pengerjaan</button>
<button class="sb" data-a="demo" data-v="3">Alur kerja: pembayaran</button>
<button class="sb" data-a="go" data-v="orders">Daftar order</button>
<button class="sb" data-a="go" data-v="svc">Atur layanan dan harga</button>
<button class="sb" data-a="go" data-v="prod">Produk dan sparepart</button>
<button class="sb" data-a="go" data-v="earn">Pendapatan dan deposit</button>
<button class="sb" data-a="go" data-v="acc">Akun mitra</button>
<button class="sb" data-a="reset">Mulai ulang</button>
</aside>
<div class="phone"><div id="app"></div></div>
<script>
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const KOM=.05;
const D=()=>({on:false,v:'splash',seg:0,step:0,saldo:250000,inc:385000,cnt:3,km:2000,rad:8,job:null,offer:null,left:60,extra:null,pay:'Tunai',photo:[0,0],chk:[0,0,0],hist:[
{n:'Ganti aki motor',c:'Dodi P.',t:'09.12',v:97200},{n:'Tambal ban motor',c:'Sari W.',t:'07.40',v:28500},{n:'Servis ringan',c:'Hendra',t:'Kemarin',v:62000}],
add:0,form:{n:'',k:'Aki',p:'',s:'',f:0},prod:[{n:'Aki GS Astra 5Ah',k:'Aki',p:185000,s:6,a:1,i:'🔋'},{n:'Ban dalam motor 17 inci',k:'Ban',p:35000,s:12,a:1,i:'🛞'},{n:'Oli MPX2 0,8 L',k:'Oli',p:52000,s:20,a:1,i:'🛢'},{n:'Kampas rem depan Beat',k:'Kampas rem',p:45000,s:0,a:1,i:'🛑'}],svc:[{n:'Tambal ban motor',p:25000,a:1,mn:15000,mx:40000},{n:'Ganti aki',p:40000,a:1,mn:25000,mx:70000},{n:'Servis ringan motor',p:60000,a:1,mn:40000,mx:120000},{n:'Jumpstart aki',p:30000,a:1,mn:20000,mx:50000},{n:'Ganti oli',p:30000,a:0,mn:20000,mx:60000}]});
let S=D(),tm=null,tt=null;
const $=s=>document.querySelector(s);
const JOB=()=>({c:'Rina Anggraini',veh:'Honda Beat 2020 · B 4521 KXY',n:'Tambal ban motor',al:'Jl. Melati No. 12, depan minimarket',km:2.4,jasa:25000,note:'Ban belakang kempis, motor di pinggir jalan.'});
const jf=j=>Math.round(j.km*S.km/100)*100;
const tot=()=>S.job.jasa+jf(S.job)+(S.extra&&S.extra.ok?S.extra.p:0);
const kom=()=>Math.round(tot()*KOM);
function toast(m){S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast='';R()},2200)}
function nav(){const t=[['home','🏠','Beranda'],['orders','📋','Order'],['svc','🔧','Layanan'],['prod','📦','Produk'],['earn','💰','Pendapatan'],['acc','👤','Akun']];
return '<div class="nav">'+t.map(x=>`<button class="${S.v===x[0]?'on':''}" data-a="go" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')+'</div>'}
const hd=(t,s)=>`<div class="hd"><div><b>${t}</b>${s?`<small>${s}</small>`:''}</div><span class="pill ok">Terverifikasi</span></div>`;
function home(){
const low=S.saldo<50000;
return hd('Halo, Pak Joko','Bengkel Joko Motor · ★ 4,8')+`<div class="bd">
<div class="on-card ${S.on?'live':''}"><div><div class="h2" style="color:#fff">${S.on?'Kamu online':'Kamu offline'}</div><div style="font-size:12px;opacity:.9">${S.on?'Menunggu order dalam radius '+S.rad+' km':'Aktifkan untuk menerima order'}</div></div><button class="sw ${S.on?'on':''}" data-a="online" aria-label="Status online"><i></i></button></div>
${low?'<div class="warn">Saldo deposit di bawah Rp50.000. Top up agar tetap bisa menerima order.</div>':''}
<div class="st"><div><b>${S.cnt}</b><span>Order hari ini</span></div><div><b>${rp(S.inc).replace('Rp','Rp ')}</b><span>Pendapatan</span></div><div><b>4,8</b><span>Rating</span></div></div>
<div class="c"><div class="r sp"><span class="h2">Saldo deposit</span><button class="btn sm y" data-a="go" data-v="earn">Top up</button></div><div class="big">${rp(S.saldo)}</div><div class="mu">Komisi BengKu ${KOM*100}% (tahap mitra perintis) dipotong dari saldo ini setiap order selesai.</div></div>
<div class="c"><div class="r sp"><span class="h2">Insentif minggu ini</span><span class="pill w">12 / 20 order</span></div><div class="stp"><i class="d"></i><i class="d"></i><i class="d"></i><i></i><i></i></div><div class="mu">Selesaikan 20 order dengan rating 4,5+ untuk bonus Rp100.000.</div></div>
<div class="c"><div class="h2">Coba alur order</div><div class="mu">Simulasikan order masuk seperti saat mitra online.</div><button class="btn" data-a="sim">Simulasikan order masuk</button></div></div>`+nav()}
function offer(){const j=S.offer,ci=2*Math.PI*28;
return `<div class="ov"><div class="sheet"><div class="r"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="#E3E8EE" stroke-width="6"/><circle cx="32" cy="32" r="28" fill="none" stroke="#1A4A94" stroke-width="6" stroke-linecap="round" stroke-dasharray="${ci}" stroke-dashoffset="${ci*(1-S.left/60)}"/></svg><b>${S.left}</b></div><div class="f"><div class="h2">Order baru masuk</div><div class="mu">Terima sebelum waktu habis</div></div></div>
<div class="c" style="gap:4px"><div class="h2">${j.n}</div><div class="mu">${j.veh}</div><div class="mu">${j.al} · ${j.km} km dari kamu</div><div class="mu">“${j.note}”</div></div>
<div class="row"><span>Jasa</span><b>${rp(j.jasa)}</b></div><div class="row"><span>Biaya jarak (${j.km} km × ${rp(S.km)})</span><b>${rp(jf(j))}</b></div>
<div class="row t"><span>Kamu terima (est.)</span><span>${rp((j.jasa+jf(j))*(1-KOM))}</span></div>
<div class="r"><button class="btn red" data-a="tolak">Tolak</button><button class="btn y" data-a="terima">Terima order</button></div></div></div>`}
function job(){const j=S.job,st=['Menuju lokasi','Cek kendaraan','Pengerjaan','Pembayaran','Selesai'];
const bar=`<div class="stp">${st.map((_,i)=>`<i class="${i<=S.step?'d':''}"></i>`).join('')}</div>`;
let b='';
if(S.step==0)b=`<div class="map"><div class="pin" style="left:62%;top:22%;background:var(--er)"><span>📍</span></div><div class="pin" style="left:16%;top:62%;background:var(--y)"><span>🏍</span></div></div>
<div class="c"><div class="r sp"><div><div class="h2">${j.c}</div><div class="mu">${j.veh}</div></div><span class="pill">${j.km} km</span></div><div class="mu">${j.al}</div><div class="r"><button class="btn g" data-a="toast" data-m="Menelepon lewat nomor yang dimasking">Telepon</button><button class="btn g" data-a="toast" data-m="Chat dibuka">Chat</button></div></div>
<button class="btn y" data-a="step" data-v="1">Saya sudah tiba di lokasi</button><button class="btn red" data-a="batal">Batalkan order</button>`;
if(S.step==1)b=`<div class="c"><div class="h2">Cek kendaraan</div><div class="mu">Hasil cek: paku di ban belakang, bisa ditambal. Tidak ada biaya tambahan jika tidak ada pekerjaan lain.</div></div>
<div class="c"><div class="h2">Pekerjaan tambahan</div>${S.extra?`<div class="r sp"><span style="font-size:13px">${S.extra.n} · ${rp(S.extra.p)}</span><span class="pill ${S.extra.ok?'ok':'w'}">${S.extra.ok?'Disetujui':'Menunggu customer'}</span></div>`:`<div class="mu">Wajib disetujui customer lewat aplikasi sebelum dikerjakan.</div><button class="btn g" data-a="extra">Ajukan ganti ban dalam +Rp45.000</button>`}</div>
<button class="btn y" data-a="step" data-v="2" ${S.extra&&!S.extra.ok?'disabled style="opacity:.5"':''}>Mulai pengerjaan</button>`;
if(S.step==2){const ck=['Lepas roda dan cari sumber bocor','Tambal dan cek kebocoran','Pasang roda, isi angin'];
b=`<div class="c"><div class="h2">Checklist pengerjaan</div>${ck.map((t,i)=>`<div class="chk ${S.chk[i]?'d':''}" data-a="chk" data-v="${i}"><i>${S.chk[i]?'✓':''}</i>${t}</div>`).join('')}</div>
<div class="c"><div class="h2">Foto bukti</div><div class="r"><button class="btn ${S.photo[0]?'y':'g'}" data-a="photo" data-v="0">${S.photo[0]?'✓ ':''}Foto sebelum</button><button class="btn ${S.photo[1]?'y':'g'}" data-a="photo" data-v="1">${S.photo[1]?'✓ ':''}Foto sesudah</button></div></div>
<button class="btn y" data-a="step" data-v="3">Tandai pekerjaan selesai</button>`}
if(S.step==3)b=`<div class="c"><div class="h2">Rincian tagihan</div><div class="row"><span>${j.n}</span><span>${rp(j.jasa)}</span></div><div class="row"><span>Biaya jarak</span><span>${rp(jf(j))}</span></div>${S.extra&&S.extra.ok?`<div class="row"><span>${S.extra.n}</span><span>${rp(S.extra.p)}</span></div>`:''}<div class="row t"><span>Total ditagih</span><span>${rp(tot())}</span></div></div>
<div class="seg">${['Tunai','QRIS'].map(m=>`<button class="${S.pay==m?'on':''}" data-a="pay" data-v="${m}">${m}</button>`).join('')}</div>
${S.pay=='QRIS'?'<div class="c" style="align-items:center"><div style="width:120px;height:120px;background:repeating-conic-gradient(#10264A 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:8px"></div><div class="mu">Minta customer memindai kode QRIS ini</div></div>':'<div class="warn">Terima uang tunai dari customer sebesar '+rp(tot())+'.</div>'}
<div class="mu">Komisi ${KOM*100}% (${rp(kom())}) dipotong dari saldo deposit setelah kamu konfirmasi.</div>
<button class="btn y" data-a="bayar">Konfirmasi pembayaran diterima</button>`;
if(S.step==4)b=`<div class="c" style="align-items:center;text-align:center"><div style="font-size:42px">✅</div><div class="h2">Order selesai</div><div class="big">${rp(tot()-kom())}</div><div class="mu">Pendapatan bersih setelah komisi ${rp(kom())}</div><div class="mu">Saldo deposit sekarang ${rp(S.saldo)}</div></div>
<div class="c"><div class="h2">Beri rating customer</div><div style="font-size:26px;letter-spacing:6px">★★★★★</div></div><button class="btn y" data-a="selesai">Kembali ke beranda</button>`;
return hd(st[S.step],j.n+' · '+j.c)+`<div class="bd">${bar}${b}</div>`}
function orders(){const l=[['Baru',[]],['Berjalan',S.job?[S.job]:[]],['Selesai',S.hist]][S.seg][1];
return hd('Order','Riwayat dan pesanan aktif')+`<div class="bd"><div class="seg">${['Baru','Berjalan','Selesai'].map((t,i)=>`<button class="${S.seg==i?'on':''}" data-a="seg" data-v="${i}">${t}</button>`).join('')}</div>
${l.length?l.map(o=>S.seg==2?`<div class="c"><div class="r sp"><span class="h2">${o.n}</span><b>${rp(o.v)}</b></div><div class="mu">${o.c} · ${o.t}</div></div>`:`<div class="c"><div class="r sp"><span class="h2">${o.n}</span><span class="pill w">Berjalan</span></div><div class="mu">${o.c}</div><button class="btn y" data-a="resume">Lanjutkan order</button></div>`).join(''):`<div class="c" style="text-align:center;padding:30px"><div class="h2">${S.seg==0?'Belum ada order baru':'Tidak ada order berjalan'}</div><div class="mu">${S.on?'Tetap online, order akan muncul otomatis.':'Aktifkan status online di beranda untuk menerima order.'}</div></div>`}</div>`+nav()}
function svc(){return hd('Layanan dan harga','Pasang harga sebelum order masuk')+`<div class="bd">
${S.svc.map((s,i)=>`<div class="c"><div class="r sp"><span class="h2">${s.n}</span><button class="sw dk ${s.a?'on':''}" data-a="sa" data-v="${i}" aria-label="Aktif"><i></i></button></div>
<div class="r sp"><div class="stp2"><button data-a="sp" data-v="${i}" data-d="-5000">−</button><b style="min-width:90px;text-align:center">${rp(s.p)}</b><button data-a="sp" data-v="${i}" data-d="5000">+</button></div><span class="mu">Batas ${rp(s.mn)} sampai ${rp(s.mx)}</span></div></div>`).join('')}
<div class="c"><div class="h2">Tarif per km</div><div class="stp2"><button data-a="km" data-d="-500">−</button><b style="min-width:90px;text-align:center">${rp(S.km)}</b><button data-a="km" data-d="500">+</button></div></div>

function splash(){return `<div class="spl"><img src="${IMG.m}" alt="Maskot BengKu" style="width:240px;height:290px;object-fit:contain;margin-top:20px"><img src="${IMG.l}" alt="BengKu" style="width:260px;height:auto"><h1 style="margin:auto 0 0;text-align:center;font-size:24px;color:#10264A">Jadi Mitra BengKu</h1><p style="margin:0;text-align:center;color:#B7791F;font-weight:600;font-size:13px">Terima order servis motor dan mobil, atur harga sendiri, pendapatan langsung ke kamu</p><button class="btn" style="border-radius:999px" data-a="go" data-v="login">MULAI SEKARANG</button></div>`}
function login(){return ah('Masuk')+`<div class="bd">${logo}<p class="sm">Masukkan email terdaftar. Kami kirim kode OTP ke email.</p><h2 class="lb">Email</h2><input class="in" aria-label="Email" value="mitra@email.com"><button class="btn" data-a="go" data-v="otp">KIRIM KODE OTP KE EMAIL</button><button class="btn g" data-a="go" data-v="daftar">BELUM PUNYA AKUN? DAFTAR</button></div>`}
function daftar(){return ah('Daftar mitra')+`<div class="bd"><p class="sm">Isi data diri dan bengkelmu. Kode OTP akan dikirim ke email kamu.</p><h2 class="lb">Nama lengkap</h2><input class="in" aria-label="Nama" value="[Nama lengkap]"><h2 class="lb">Nama bengkel atau usaha</h2><input class="in" aria-label="Bengkel" value="[Nama bengkel]"><h2 class="lb">Email</h2><input class="in" aria-label="Email" value="mitra@email.com"><h2 class="lb">Nomor HP</h2><input class="in" aria-label="HP" value="+62 812 0000 0000"><p class="sm">Dengan mendaftar, kamu menyetujui Syarat &amp; Ketentuan dan Kebijakan Privasi.</p><button class="btn y" data-a="go" data-v="otp">DAFTAR &amp; KIRIM OTP</button><button class="btn g" data-a="go" data-v="login">SUDAH PUNYA AKUN? MASUK</button></div>`}
function otp(){return ah('Verifikasi email')+`<div class="bd"><p class="sm">Kode 6 digit dikirim ke m***@email.com. Cek kotak masuk atau folder spam.</p><div class="r">${['4','8','2','1','',''].map(d=>`<div class="ot">${d}</div>`).join('')}</div><p class="sm">Kirim ulang kode dalam 00:45</p><button class="btn y" data-a="go" data-v="home">VERIFIKASI</button><button class="btn g" data-a="go" data-v="login">GANTI EMAIL</button></div>`}
function R(){const sc=$('#app').querySelector('.bd'),y=sc?sc.scrollTop:0;
let h=S.v=='job'?job():{splash,login,daftar,otp,home,orders,svc,prod,earn,acc}[S.v]();
if(S.offer)h+=offer();if(S.add&&S.v=='prod')h+=addf();if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
$('#app').innerHTML=h;const n=$('#app .bd');if(n)n.scrollTop=y}
function startOffer(){S.offer=JOB();S.left=60;clearInterval(tm);tm=setInterval(()=>{S.left--;if(S.left<=0){clearInterval(tm);S.offer=null;toast('Waktu habis, order diteruskan ke mitra lain')}R()},1000)}
const A={
go(e){S.v=e.dataset.v;S.offer=null;S.add=0;clearInterval(tm);R()},
online(){S.on=!S.on;if(!S.on){S.offer=null;clearInterval(tm)}toast(S.on?'Kamu online, siap menerima order':'Kamu offline');R()},
sim(){S.on=true;S.v='home';startOffer();R()},
terima(){clearInterval(tm);S.job=S.offer;S.offer=null;S.v='job';S.step=0;S.extra=null;S.photo=[0,0];S.chk=[0,0,0];R()},
tolak(){clearInterval(tm);S.offer=null;toast('Order ditolak');R()},
demo(e){S.on=true;S.job=JOB();S.offer=null;clearInterval(tm);S.v='job';S.step=+e.dataset.v;S.extra=null;S.chk=[1,1,1];S.photo=[1,1];R()},
step(e){S.step=+e.dataset.v;R()},
batal(){S.job=null;S.v='home';toast('Order dibatalkan. Pembatalan berulang menurunkan skor mitra.');R()},
extra(){S.extra={n:'Ganti ban dalam',p:45000,ok:0};R();setTimeout(()=>{if(S.extra){S.extra.ok=1;toast('Customer menyetujui biaya tambahan');R()}},1800)},
chk(e){S.chk[e.dataset.v]^=1;R()},photo(e){S.photo[e.dataset.v]=1;R()},
pay(e){S.pay=e.dataset.v;R()},
bayar(){const k=kom(),t=tot();S.saldo-=k;S.inc+=t-k;S.cnt++;S.hist.unshift({n:S.job.n,c:S.job.c,t:'Baru saja',v:t-k});S.step=4;R()},
selesai(){S.job=null;S.v='home';S.extra=null;R()},resume(){S.v='job';R()},
seg(e){S.seg=+e.dataset.v;R()},
sa(e){S.svc[e.dataset.v].a^=1;R()},
sp(e){const s=S.svc[e.dataset.v];s.p=Math.min(s.mx,Math.max(s.mn,s.p+ +e.dataset.d));R()},
km(e){S.km=Math.min(5000,Math.max(1000,S.km+ +e.dataset.d));R()},
top(e){S.saldo+=+e.dataset.v;toast('Top up '+rp(+e.dataset.v)+' berhasil dicatat');R()},
toast(e){toast(e.dataset.m);R()},
addo(){S.add=1;R()},addc(){S.add=0;R()},fk(e){S.form.k=e.dataset.v;R()},fphoto(){S.form.f=1;R()},
pa(e){S.prod[e.dataset.v].a^=1;R()},
ps(e){const p=S.prod[e.dataset.v];p.s=Math.max(0,p.s+ +e.dataset.d);R()},
pd(e){S.prod.splice(e.dataset.v,1);toast('Produk dihapus');R()},
asave(){const f=S.form,ic={Aki:'🔋',Ban:'🛞',Oli:'🛢','Kampas rem':'🛑',Busi:'⚡',Lampu:'💡',Filter:'🧰'};if(!f.n.trim()||!(+f.p>0)){toast('Isi nama dan harga produk');R();return}
S.prod.unshift({n:f.n.trim(),k:f.k,p:+f.p,s:+f.s||0,a:1,i:ic[f.k]});S.form={n:'',k:'Aki',p:'',s:'',f:0};S.add=0;toast('Produk tersimpan dan tampil di customer');R()},
reset(){clearInterval(tm);S=D();R()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]&&t.tagName!='INPUT'&&!t.disabled)A[t.dataset.a](t)});
document.addEventListener('input',e=>{if(e.target.dataset.a=='rad'){S.rad=+e.target.value;const b=e.target.previousElementSibling.querySelector('b');if(b)b.textContent=S.rad+' km'}});
R();
</script></body></html>
